<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Multiplayer Cookie Clicker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
        }

        h1 {
            font-size: 48px;
        }

        #cookies {
            font-size: 40px;
            margin: 30px;
        }

        button {
            font-size: 28px;
            padding: 20px 40px;
            cursor: pointer;
            border-radius: 12px;
            border: none;
            background-color: #d18b47;
            color: white;
        }

        button:hover {
            background-color: #b87333;
        }

        #reset {
            margin-top: 30px;
            font-size: 18px;
            background-color: #444;
        }
    </style>
</head>
<body>
    <h1>🍪 Multiplayer Cookie Clicker</h1>

    <div id="cookies">Cookies: 0</div>

    <button onclick="clickCookie()">Klikni na cookie</button>

    <br>

    <button id="reset" onclick="resetGame()">Reset</button>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <script>
        const socket = io();

        const cookiesElement = document.getElementById("cookies");

        socket.on("state", function(data) {
            cookiesElement.textContent = "Cookies: " + data.cookies;
        });

        function clickCookie() {
            socket.emit("click");
        }

        function resetGame() {
            socket.emit("reset");
        }
    </script>
</body>
</html>
